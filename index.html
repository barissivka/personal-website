<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal website of Barış Şıvka, Visual Communication Design student at TOBB ETÜ.">
  <meta name="author" content="Barış Şıvka">
  <title>Barış Şıvka — Personal Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Theme Toggle Button -->
  <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
    <!-- Sun Icon -->
    <svg id="sunIcon" class="hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.02.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
    </svg>
    <!-- Moon Icon -->
    <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M12.3 22h-.1c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.2-9.8.6-.1 1.2.3 1.3.9.1.6-.3 1.2-.9 1.3-3.6.7-6.2 3.8-6.2 7.6 0 4.4 3.6 8 8 8 3.8 0 6.9-2.6 7.6-6.2.1-.6.7-1 1.3-.9.6.1 1 .7.9 1.3-.9 4.7-5 8.2-9.8 8.2z"/>
    </svg>
    <span id="themeToggleText">Theme</span>
  </button>

  <main class="container">
    <article class="profile-grid">
      <!-- Profile Photo -->
      <div class="photo-wrapper">
        <img class="profile-photo" src="avatar.jpg" alt="Barış Şıvka Profile Photo">
      </div>

      <!-- Profile Information -->
      <section class="info-section">
        <span class="designer-badge">Student & Designer</span>
        <h1 class="profile-name">Barış Şıvka</h1>
        
        <ul class="details-list">
          <li class="detail-item">
            <span class="detail-label">University</span>
            <span class="detail-value">TOBB ETÜ</span>
          </li>
          <li class="detail-item">
            <span class="detail-label">Department</span>
            <span class="detail-value">Visual Communication Design</span>
          </li>
          <li class="detail-item">
            <span class="detail-label">Date of Birth</span>
            <span class="detail-value">February 26, 2004</span>
          </li>
        </ul>

        <!-- Footer Elements -->
        <footer class="footer-info">
          <div class="status-indicator">
            <span class="status-dot"></span>
            <span>Available for projects</span>
          </div>
          <span>&copy; 2026</span>
        </footer>
      </section>
    </article>
  </main>

  <script>
    // Theme Toggle Functionality
    const themeToggleBtn = document.getElementById('themeToggle');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    const themeToggleText = document.getElementById('themeToggleText');

    // Check localStorage or System preferences
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    
    let isDark = savedTheme === 'dark' || (!savedTheme && systemPrefersDark);
    
    // Apply initial theme
    if (isDark) {
      document.documentElement.setAttribute('data-theme', 'dark');
      sunIcon.style.display = 'block';
      moonIcon.style.display = 'none';
    } else {
      document.documentElement.setAttribute('data-theme', 'light');
      sunIcon.style.display = 'none';
      moonIcon.style.display = 'block';
    }

    themeToggleBtn.addEventListener('click', () => {
      isDark = !isDark;
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('theme', 'light');
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      }
    });
  </script>
</body>
</html>
